# 建置並部署 skills-atlas 到 GitHub Pages。
# 一次性手動設定（無法用 GITHUB_TOKEN 自動化）：
#   repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   在那之前 deploy job 會以 "Get Pages site failed" 失敗。
#
# pull_request 觸發只跑測試與建置，不碰 Pages —— configure-pages、upload 與
# deploy 三個步驟都需要 Pages API，在 PR 上執行只會失敗，而且會把已上線的
# 站台換成 PR 分支的產出。
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 依 ref 分組：PR 的執行不會取消正在跑的 master 部署，
  # 但同一個 PR 連推兩次時，前一次會被取消。
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 24，不是 20：測試指令用 glob 形式（`node --test "test/unit/**/*.test.mjs"`），
          # 而 node --test 的 glob 支援從 Node 21 才有。
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build (runs data validation first)
        run: npm run build
      - name: Smoke tests against dist/
        run: npm run test:smoke
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
